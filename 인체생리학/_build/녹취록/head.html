<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>인체생리학 강의녹취록</title>
<style>
@page{size:297mm 186mm;margin:0}
*{box-sizing:border-box;margin:0;padding:0}
html,body{font-family:Pretendard,sans-serif;color:#1f2433;font-size:10.2pt;line-height:1.55;-webkit-print-color-adjust:exact;print-color-adjust:exact;background:#fff}
b{font-weight:700}
.pg{width:297mm;height:186mm;padding:8mm 10mm 0;position:relative;display:flex;flex-direction:column;overflow:hidden;page-break-after:always;--c:#1c3d7a}
.foot{position:absolute;left:10mm;right:10mm;bottom:3.6mm;display:flex;justify-content:space-between;font-size:6.4pt;color:#a3a8b5}
.ph{display:flex;align-items:center;gap:2.2mm;margin-bottom:4mm;flex:none}
.chip{background:#1d2747;color:#fff;font-size:7pt;font-weight:700;border-radius:10mm;padding:.7mm 2.6mm}
.part{color:var(--c);font-size:7.2pt;font-weight:800;letter-spacing:.04em}
.pt{font-size:14pt;font-weight:800;letter-spacing:-.01em;white-space:nowrap}
.pl{flex:1;height:1.4px;background:linear-gradient(90deg,var(--c),#e9ecf3 60%);opacity:.75;margin-left:1mm}
.pn{font-size:6.6pt;color:#9aa0ad;white-space:nowrap}
.pb{flex:1;min-height:0;padding-bottom:9mm;overflow:hidden}
.grid{display:grid;gap:3.2mm;align-items:start}
.col{display:flex;flex-direction:column;gap:3.2mm}
.card{border:1px solid #e3e6ee;border-radius:3mm;padding:3mm 3.4mm;background:#fff;box-shadow:0 .4mm 1.2mm rgba(25,35,70,.05)}
.ct{font-size:10.6pt;font-weight:800;margin-bottom:1.6mm;color:#1d2747}
.ct .tm{font-size:6.6pt;font-weight:600;color:#9aa0ad;margin-left:1.5mm}
.card p{margin:.6mm 0}
.card ul,.card ol{padding-left:4.2mm;margin:.6mm 0}
.card li{margin:.35mm 0}
.card.sum{background:#eef1fb;border:none;border-left:1.3mm solid #1d2747}
.card.tip{background:#fff9e6;border-color:#f5e2a3}.card.tip .ct{color:#9a6b00}
.card.warn{background:#fff1f2;border-color:#f8c9cf}.card.warn .ct{color:#c92a2a}
.card.mint{background:#ecf8f3;border-color:#bfe6d5}.card.mint .ct{color:#0b7a5a}
.card.why{background:#f6f2ff;border-color:#ddd0fb}.card.why .ct{color:#6741d9}
.hy{background:#fff0a6;border-radius:.6mm;padding:0 .5mm}
.hp{background:#ffd5df;border-radius:.6mm;padding:0 .5mm}
.ac{color:var(--c);font-weight:800}
small,.sm{font-size:7.8pt;color:#7a8191}
.quote{font-size:8pt;color:#5c6684;font-style:italic;border-left:1mm solid #c9cfe0;padding:.6mm 2.4mm;margin-top:1.4mm}
table{border-collapse:collapse;width:100%;font-size:9.4pt}
th{background:#eef1f7;color:#38415a;font-weight:700;text-align:left;padding:1.1mm 1.6mm;border-bottom:1px solid #d7dce8}
td{padding:1mm 1.6mm;border-bottom:1px solid #eceef4;vertical-align:top}
td:first-child{font-weight:600}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:1mm;margin:1mm 0}
.flow span{border:1.2px solid var(--c);color:#1d2747;border-radius:1.6mm;padding:.5mm 1.8mm;font-weight:700;font-size:8.6pt;background:#fff}
.flow i{font-style:normal;color:var(--c);font-weight:800}
.steps{list-style:none;padding:0!important;counter-reset:s}
.steps li{counter-increment:s;position:relative;padding-left:6mm;margin:1.1mm 0!important}
.steps li::before{content:counter(s);position:absolute;left:0;top:.3mm;width:4.2mm;height:4.2mm;border-radius:50%;background:var(--c);color:#fff;font-size:6.6pt;font-weight:800;display:flex;align-items:center;justify-content:center}
.kw{display:inline-block;border:1px solid #c9cfe0;border-radius:10mm;padding:.2mm 2.2mm;margin:0 1mm 1.2mm 0;font-size:7.3pt;font-weight:600;color:#33405f;background:#fff}
/* cover */
.cover{background:linear-gradient(135deg,#0f1c3f 0%,#1d3a7a 55%,#2f5aa8 100%);color:#fff;padding:22mm 24mm;justify-content:center}
.cover .lab{font-size:9pt;letter-spacing:.3em;opacity:.75;font-weight:700}
.cover h1{font-size:30pt;font-weight:800;margin:4mm 0 2mm;letter-spacing:-.02em;line-height:1.2}
.cover h2{font-size:14pt;font-weight:600;opacity:.92}
.cover .meta{margin-top:12mm;font-size:9pt;opacity:.85;line-height:1.8}
.cover .tags{margin-top:6mm}
.cover .tags span{display:inline-block;border:1px solid rgba(255,255,255,.45);border-radius:10mm;padding:.6mm 3mm;margin:0 1.6mm 1.6mm 0;font-size:8pt}
.card.def{background:#f3f1fd;border:none;border-left:1.2mm solid #6f5bd6}.card.def .ct{color:#5b47c4}
td:first-child,th:first-child{white-space:nowrap}
</style></head><body>
