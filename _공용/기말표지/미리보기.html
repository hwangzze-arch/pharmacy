<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>기말 마스터 노트 표지</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter+Tight:wght@500;600;700;800&family=Noto+Sans+KR:wght@400;500;700;800&display=swap"><style>/* 기말 마스터 노트 공용 표지 (2026-2)
   배치: 가는 선 · 넓은 여백 · 굵은 과목명(Noto Sans KR 800) · 굵은 장 번호(Inter Tight 800) · 오른쪽 끝 과목별 인덱스 탭
   표지 크기는 cqw(표지 폭 기준) 단위라 16:10(842×527pt)이든 A4 가로(842×595pt)든 같은 비율로 그려진다. */
:root{
  --f-kr:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-lat:"Inter Tight","Noto Sans KR",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
.cover{
  --c:#8C2D4E; --paper:#FAFAF8; --ink:#1A1B1D; --soft:#76797E; --hair:#DADAD6;
  container-type:inline-size; position:relative; overflow:hidden;
}
.cover *{box-sizing:border-box}
.cv{position:absolute;inset:0;background:var(--paper);color:var(--ink);font-family:var(--f-kr);
  padding:3.4cqw 5.4cqw 3cqw 4.6cqw;display:grid;grid-template-columns:1fr 31cqw;grid-template-rows:auto 1fr auto;column-gap:5cqw}

.cv-meta{grid-column:1/-1;display:flex;justify-content:space-between;gap:2cqw;padding-bottom:1.3cqw;border-bottom:.07cqw solid var(--hair);
  font-family:var(--f-lat);font-size:1cqw;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--soft)}
.cv-meta b{font-weight:600;color:var(--ink)}

.cv-left{display:flex;flex-direction:column;justify-content:space-between;padding-top:2.6cqw;min-width:0}
.cv-kick{display:flex;align-items:center;gap:1cqw;font-size:1.3cqw;font-weight:700;color:var(--c)}
.cv-kick::before{content:"";width:.85cqw;height:.85cqw;border-radius:50%;background:var(--c)}
.cv-head{display:grid;padding-bottom:3cqw}
.cv-subject{margin:0;font-size:6.6cqw;line-height:1.05;font-weight:800;letter-spacing:-.045em}
.cv-en{margin-top:.9cqw;font-family:var(--f-lat);font-size:1.55cqw;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:#56585D}
.cv-title{margin:3cqw 0 0;font-size:2.6cqw;line-height:1.25;font-weight:700;letter-spacing:-.03em;text-wrap:balance}
.cv-flow{display:flex;flex-wrap:wrap;gap:.4cqw 1cqw;align-items:center;margin-top:1.1cqw;font-size:1.2cqw;color:var(--soft)}
.cv-flow span+span::before{content:"";display:inline-block;width:1.8cqw;height:.08cqw;background:var(--c);vertical-align:middle;margin-right:1cqw}

.cv-right{display:grid;grid-template-rows:auto 1fr auto;padding-top:2cqw;min-width:0}
.cv-lab{font-family:var(--f-lat);font-size:1.05cqw;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--soft)}
.cv-num{margin:.5cqw 0 0 -.5cqw;font-family:var(--f-lat);font-weight:800;color:var(--c);font-size:15cqw;line-height:.84;letter-spacing:-.05em;white-space:nowrap}
.cv-num.long{font-size:10.4cqw}
.cv-num.word{font-size:9cqw;letter-spacing:-.035em}
.cv-toc{list-style:none;margin:0;padding:0 0 3cqw;align-self:end;display:grid}
.cv-toc li{display:grid;grid-template-columns:3.2cqw 1fr;gap:0 .8cqw;padding:1cqw 0 1.05cqw;border-top:.07cqw solid var(--hair)}
.cv-toc li:last-child{border-bottom:.07cqw solid var(--hair)}
.cv-toc i{grid-row:span 2;font-style:normal;font-family:var(--f-lat);font-weight:700;font-size:1.05cqw;color:var(--c);padding-top:.15cqw}
.cv-toc b{font-size:1.3cqw;font-weight:700;letter-spacing:-.02em;line-height:1.35}
.cv-toc span{font-size:1cqw;color:var(--soft);line-height:1.4}

.cv-foot{grid-column:1/-1;display:flex;justify-content:space-between;align-items:end;gap:2cqw;padding-top:1.3cqw;border-top:.07cqw solid var(--hair)}
.cv-facts{display:flex;gap:3.2cqw;margin:0}
.cv-facts div{display:flex;align-items:baseline;gap:.6cqw}
.cv-facts dd{margin:0;font-family:var(--f-lat);font-weight:800;font-size:2.1cqw;line-height:1;font-variant-numeric:tabular-nums}
.cv-facts dt{font-size:1cqw;color:var(--soft)}
.cv-code{font-family:var(--f-mono);font-size:.95cqw;letter-spacing:.1em;color:var(--soft);text-transform:uppercase}

/* 인덱스 탭: 과목마다 높이가 고정 (유기 1 · 생화 2 · 생리 3 · 미생 4 · 분석 5 · 물약 6 · 신약 7) */
.cv-tab{position:absolute;right:0;width:1.6cqw;height:8.4%;top:calc(14% + var(--slot) * 10.4%);background:var(--c);display:grid;place-items:center}
.cv-tab::after{content:attr(data-k);writing-mode:vertical-rl;color:#fff;font-size:.85cqw;font-weight:700;letter-spacing:.2em}

.s-orgo{--c:#8C2D4E;--slot:0}
.s-bio{--c:#B5592F;--slot:1}
.s-phys{--c:#A8452F;--slot:2}
.s-micro{--c:#1F6F5C;--slot:3}
.s-anal{--c:#2C4C9A;--slot:4}
.s-pharm{--c:#1D6378;--slot:5}
.s-drug{--c:#5A3A86;--slot:6}

/* 목차 쪽 왼쪽 띠 (유기화학·약품생화학처럼 1쪽이 '색 패널 + 목차'인 파일에서 색 패널 자리를 덮는다) */
.strip{position:absolute;left:0;top:0;bottom:0;background:#fff;border-right:.6pt solid #E2E0DC;
  padding:26pt 20pt 22pt 24pt;display:flex;flex-direction:column;font-family:var(--f-kr);color:#1A1B1D}
.strip .cv-kick{font-size:8.5pt;gap:6pt}
.strip .cv-kick::before{width:5.5pt;height:5.5pt}
.strip .s-lab{margin-top:30pt;font-family:var(--f-lat);font-size:7pt;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:#76797E}
.strip .s-num{margin:4pt 0 0 -2pt;font-family:var(--f-lat);font-weight:800;color:var(--c);font-size:68pt;line-height:.84;letter-spacing:-.05em;white-space:nowrap}
.strip .s-num.long{font-size:52pt}
.strip .s-subj{margin-top:22pt;font-size:21pt;font-weight:800;letter-spacing:-.045em;line-height:1.1}
.strip .s-en{margin-top:4pt;font-family:var(--f-lat);font-size:6.6pt;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#56585D}
.strip .s-title{margin-top:12pt;font-size:11pt;font-weight:700;letter-spacing:-.03em;line-height:1.35}
.strip .s-facts{margin-top:auto;display:grid;gap:7pt;padding-top:10pt;border-top:.6pt solid #E2E0DC}
.strip .s-facts div{display:flex;align-items:baseline;gap:5pt}
.strip .s-facts dd{margin:0;font-family:var(--f-lat);font-weight:800;font-size:15pt;line-height:1}
.strip .s-facts dt{font-size:7.5pt;color:#76797E}
.strip .s-code{margin-top:12pt;font-family:var(--f-mono);font-size:6.5pt;letter-spacing:.1em;color:#76797E}

body{margin:0;padding:40px 24px;background:#ECEDEF;font-family:var(--f-kr)}
main{max-width:1100px;margin:0 auto;display:grid;gap:36px} figure{margin:0}
figure .cover{aspect-ratio:16/10;width:100%!important;height:auto!important;box-shadow:0 18px 40px -18px rgba(0,0,0,.3)}
figcaption{margin-top:8px;font:12px var(--f-mono);color:#5E646C}</style></head>
